services:
  - type: web
    name: easytrip-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @easytrip/api db:generate && pnpm --filter @easytrip/api build
    startCommand: pnpm --filter @easytrip/api start
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: easytrip-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: mock
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: SEED_DEMO_DATA
        value: "false"
      - key: LOCAL_STORAGE_DIR
        value: /tmp/easytrip-storage

databases:
  - name: easytrip-db
    databaseName: easytrip
    user: easytrip
    plan: free
    region: oregon
    postgresMajorVersion: "16"
